# Production overrides. Use with:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Key differences from dev:
#   - No source volume mounts (image contains the code built at deploy time)
#   - No --reload on uvicorn
#   - Celery beat runs in a separate container from the worker (prevents double-firing on restarts)
#   - APP_ENV=production enforces INTERNAL_SECRET and CORS_ORIGINS guards at startup
#   - All services ship structured JSON logs to CloudWatch via the awslogs driver
#     Requires: AWS credentials available on the host (IAM role or ~/.aws mount)
#     Log groups are created automatically on first run if the IAM role has logs:CreateLogGroup

# Reusable CloudWatch logging config — applied to every Python service.
# CLOUDWATCH_LOG_GROUP must be set in .env (e.g. /asheflow/production).
# AWS_DEFAULT_REGION must match the region where the log group lives.
x-cloudwatch-logging: &cloudwatch-logging
  driver: awslogs
  options:
    awslogs-group: ${CLOUDWATCH_LOG_GROUP:-/asheflow/production}
    awslogs-region: ${AWS_REGION:-us-east-2}
    awslogs-stream: asheflow

services:
  backend:
    environment:
      - APP_ENV=production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    logging: *cloudwatch-logging

  celery_worker:
    environment:
      - APP_ENV=production
    command: celery -A app.celery_app worker --loglevel=info
    restart: always
    logging: *cloudwatch-logging

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asheflow_celery_beat
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asheflow}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-asheflow_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET must be set in .env}
      # Settings() validates this at import, so beat cannot start without it —
      # it was missing here while backend and celery_worker both declared it in
      # docker-compose.yml, which is why this service crash-looped the first
      # time it was ever run (ADR-282).
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set in .env}
      - APP_ENV=production
      - TZ=America/New_York
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app beat --loglevel=info
    restart: always
    logging: *cloudwatch-logging
