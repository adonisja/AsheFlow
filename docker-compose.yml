  #   volumes:
  #     - ./backend:/app
  #   depends_on:
  #     - postgres
  #     - redis
  #   command: celery -A app.celery_app worker --loglevel=info

  # frontend: (disabled until frontend phase begins)
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile.dev
  #   container_name: asheflow_frontend
  #   environment:
  #     - REACT_APP_API_URL=http://localhost:8000
