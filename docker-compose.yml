services:
  postgres:
    image: postgres:15-alpine
    container_name: asheflow_postgres
    environment:
      POSTGRES_USER: asheflow
      POSTGRES_PASSWORD: asheflow_dev_password
      POSTGRES_DB: asheflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asheflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: asheflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asheflow_backend
    environment:
      - DATABASE_URL=postgresql://asheflow:asheflow_dev_password@postgres:5432/asheflow_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # celery_worker: (disabled until backend is complete)
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: asheflow_celery
  #   environment:
  #     - DATABASE_URL=postgresql://asheflow:asheflow_dev_password@postgres:5432/asheflow_db
  #     - REDIS_URL=redis://redis:6379/0
