services:
  postgres:
    image: postgres:15-alpine
    container_name: asheflow_postgres
    environment:
      POSTGRES_USER: asheflow
      POSTGRES_PASSWORD: asheflow_dev_password
      POSTGRES_DB: asheflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asheflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: asheflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asheflow_backend
    environment:
      - DATABASE_URL=postgresql://asheflow:asheflow_dev_password@postgres:5432/asheflow_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENVIRONMENT=development
      - BOT_INTERNAL_URL=http://bot:8001
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: asheflow_bot
    env_file:
      - ./bot/.env
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
    ports:
      - "8001:8001"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asheflow_celery
    environment:
      - DATABASE_URL=postgresql://asheflow:asheflow_dev_password@postgres:5432/asheflow_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # --beat runs the scheduler inside the same worker process.
    # Fine for a single-worker setup; split into separate beat + worker
    # containers if you scale workers horizontally in the future.
    command: celery -A app.celery_app worker --beat --loglevel=info
    restart: unless-stopped

  # frontend: (disabled until frontend phase begins)
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile.dev
  #   container_name: asheflow_frontend
  #   environment:
  #     - REACT_APP_API_URL=http://localhost:8000
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   depends_on:
  #     - backend
  #   command: npm start

volumes:
  postgres_data:
  redis_data:
