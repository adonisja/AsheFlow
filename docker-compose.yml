# Copy .env.example → .env and fill in real values before starting.
# Never commit .env — it contains secrets.

services:
  postgres:
    image: postgres:15-alpine
    container_name: asheflow_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asheflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-asheflow_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asheflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: asheflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asheflow_backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asheflow}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-asheflow_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - APP_ENV=${APP_ENV:-development}
      - BOT_INTERNAL_URL=http://bot:8001
      - INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET must be set in .env}
      - DISCORD_DRIVERS_CHANNEL_ID=${DISCORD_DRIVERS_CHANNEL_ID:-}
      - TZ=America/New_York
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asheflow_celery_worker
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asheflow}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-asheflow_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET must be set in .env}
      - TZ=America/New_York
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
