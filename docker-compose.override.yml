# Auto-loaded by `docker-compose up` in development.
# Adds hot-reload volume mounts and dev-only settings on top of docker-compose.yml.
# Never use this file in staging or production.

services:
  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ~/.aws:/root/.aws:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    volumes:
      - ./backend:/app
      - ~/.aws:/root/.aws:ro
    command: celery -A app.celery_app worker --beat --loglevel=info
