name: CI

# PIPELINE GATES
# ─────────────────────────────────────────────────────────────────────────────
# Every push to any branch runs audit + test (fast feedback).
# Deploy to prod triggers only on master after both jobs pass.
#
# Current environment map:
#   localhost  → dev  (no CI deploy — run locally)
#   3.141.169.13 (EC2) → prod  (auto-deploy on green master)
#
# Future: add a staging EC2, create a staging branch, uncomment deploy-staging.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  # ── 1. SECURITY AUDIT ──────────────────────────────────────────────────────
  audit:
    name: Dependency CVE audit
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit --quiet

      - name: Audit backend dependencies
        working-directory: backend
        run: pip-audit -r requirements.txt

  # ── 2. BACKEND TESTS ───────────────────────────────────────────────────────
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: audit
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: redis://localhost:6379/0
          AWS_REGION: us-east-1
          AWS_COGNITO_USER_POOL_ID: us-east-1_TESTPOOL
          AWS_COGNITO_APP_CLIENT_ID: test-client-id
          INTERNAL_SECRET: ci-test-secret-not-real

  # ── 3. DEPLOY TO PROD ──────────────────────────────────────────────────────
  # Triggers on master pushes only, after audit + test pass.
  # Uses AWS SSM SendCommand — no port 22 needed, no SSH key in secrets.
  deploy-prod:
    name: Deploy → PROD
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: prod
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region us-east-2 \
            --instance-ids i-095bf2ed310c86741 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "git config --global --add safe.directory /home/ubuntu/AsheFlow",
              "cd /home/ubuntu/AsheFlow && git pull origin master",
              "cd /home/ubuntu/AsheFlow && docker compose build backend",
              "cd /home/ubuntu/AsheFlow && docker compose up -d backend"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for AWS to register the invocation record before polling
          sleep 15

          # Poll until the command finishes (max ~3 minutes)
          for i in $(seq 1 18); do
            STATUS=$(aws ssm get-command-invocation \
              --region us-east-2 \
              --command-id "$COMMAND_ID" \
              --instance-id i-095bf2ed310c86741 \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "[$i] Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deploy succeeded."
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              aws ssm get-command-invocation \
                --region us-east-2 \
                --command-id "$COMMAND_ID" \
                --instance-id i-095bf2ed310c86741 \
                --query "StandardErrorContent" \
                --output text
              echo "Deploy failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "Deploy timed out waiting for SSM command."
          exit 1

  # ── 4. DEPLOY TO STAGING ───────────────────────────────────────────────────
  # TODO: uncomment when staging EC2 is provisioned and secrets are added:
  #       STAGING_EC2_HOST, STAGING_EC2_SSH_KEY
