name: CI

# PIPELINE GATES
# ─────────────────────────────────────────────────────────────────────────────
# Every push to any branch runs audit + test (fast feedback).
# Deploy to prod triggers only on master after both jobs pass.
#
# Current environment map:
#   localhost  → dev  (no CI deploy — run locally)
#   3.141.169.13 (EC2) → prod  (auto-deploy on green master)
#
# Future: add a staging EC2, create a staging branch, uncomment deploy-staging.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  # ── 1. SECURITY AUDIT ──────────────────────────────────────────────────────
  audit:
    name: Dependency CVE audit
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit --quiet

      - name: Audit backend dependencies
        working-directory: backend
        run: pip-audit -r requirements.txt

  # ── 2. BACKEND TESTS ───────────────────────────────────────────────────────
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: audit
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: redis://localhost:6379/0
          AWS_REGION: us-east-1
          AWS_COGNITO_USER_POOL_ID: us-east-1_TESTPOOL
          AWS_COGNITO_APP_CLIENT_ID: test-client-id
          INTERNAL_SECRET: ci-test-secret-not-real

  # ── 3. DEPLOY TO PROD ──────────────────────────────────────────────────────
  # Triggers on master pushes only, after audit + test pass.
  deploy-prod:
    name: Deploy → PROD
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: prod
    steps:
      - name: Deploy backend to PROD EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/AsheFlow
            git pull origin master
            docker compose build backend
            docker compose up -d backend

  # ── 4. DEPLOY TO STAGING ───────────────────────────────────────────────────
