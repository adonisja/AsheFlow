name: CI

# PIPELINE GATES
# ─────────────────────────────────────────────────────────────────────────────
# Every push to any branch runs audit + test (fast feedback).
#
# Environment map:
#   localhost        → dev    (no CI deploy — run locally)
#   staging branch   → staging EC2 + S3 (auto-deploy after green tests)
#   master branch    → prod EC2 + S3    (auto-deploy after green tests)
#
# Backend secrets live in AWS SSM Parameter Store (/asheflow/staging/ and
# /asheflow/prod/). The EC2 instance role has read access; CI never touches
# the secret values. Frontend secrets are injected from GitHub Actions secrets
# at build time.
#
# Staging EC2 is stopped by default (Option B — cost saving).
# CI starts it before deploy and stops it 30 minutes after deploy completes.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, staging]

jobs:
  # ── 1. SECURITY AUDIT ──────────────────────────────────────────────────────
  audit:
    name: Dependency CVE audit
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit --quiet

      - name: Audit backend dependencies
        working-directory: backend
        run: pip-audit -r requirements.txt

  # ── 2. BACKEND TESTS ───────────────────────────────────────────────────────
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: audit
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: redis://localhost:6379/0
          AWS_REGION: us-east-1
          AWS_COGNITO_USER_POOL_ID: us-east-1_TESTPOOL
          AWS_COGNITO_APP_CLIENT_ID: test-client-id
          INTERNAL_SECRET: ci-test-secret-not-real
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}

  # ── 3. DEPLOY TO STAGING ───────────────────────────────────────────────────
  # Triggers on staging branch pushes only, after audit + test pass.
  # Starts the staging EC2 (stopped by default), deploys backend via SSM,
  # builds frontend with staging secrets, syncs to staging S3, invalidates CDN.
  deploy-staging:
    name: Deploy → STAGING
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # Start staging EC2 — it's stopped by default to save cost
      - name: Start staging EC2
        run: |
          aws ec2 start-instances --instance-ids ${{ secrets.STAGING_EC2_INSTANCE_ID }}
          aws ec2 wait instance-running --instance-ids ${{ secrets.STAGING_EC2_INSTANCE_ID }}
          echo "EC2 is running. Waiting for SSM Agent..."
          for i in $(seq 1 36); do
            PING=$(aws ssm describe-instance-information \
              --instance-information-filter-list "key=InstanceIds,valueSet=${{ secrets.STAGING_EC2_INSTANCE_ID }}" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>&1 || echo "NotReady")
            echo "[$i/36] SSM ping: $PING"
            if [ "$PING" = "Online" ]; then echo "SSM Agent is ready."; break; fi
            sleep 10
          done
          [ "$PING" = "Online" ] || (echo "SSM Agent never came online." && exit 1)

      # EC2 uses boto3 to pull /asheflow/staging/* from SSM Parameter Store.
      # No secret values pass through the CI runner or CLI arguments.
      - name: Write staging backend .env via SSM Parameter Store
        run: |
          GEOCLIENT_APP_KEY=$(aws ssm get-parameter \
            --name /asheflow/staging/GEOCLIENT_APP_KEY \
            --with-decryption --region us-east-2 \
            --query Parameter.Value --output text)
          COMMAND_ID=$(aws ssm send-command \
            --region us-east-2 \
            --instance-ids ${{ secrets.STAGING_EC2_INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "python3 -c \"import boto3; c=boto3.client(region_name=chr(117)+chr(115)+chr(45)+chr(101)+chr(97)+chr(115)+chr(116)+chr(45)+chr(50),service_name=chr(115)+chr(115)+chr(109)); pag=c.get_paginator(chr(103)+chr(101)+chr(116)+chr(95)+chr(112)+chr(97)+chr(114)+chr(97)+chr(109)+chr(101)+chr(116)+chr(101)+chr(114)+chr(115)+chr(95)+chr(98)+chr(121)+chr(95)+chr(112)+chr(97)+chr(116)+chr(104)); ps=[]; [ps.extend(page[chr(80)+chr(97)+chr(114)+chr(97)+chr(109)+chr(101)+chr(116)+chr(101)+chr(114)+chr(115)]) for page in pag.paginate(Path=chr(47)+chr(97)+chr(115)+chr(104)+chr(101)+chr(102)+chr(108)+chr(111)+chr(119)+chr(47)+chr(115)+chr(116)+chr(97)+chr(103)+chr(105)+chr(110)+chr(103)+chr(47),WithDecryption=True)]; skip={chr(80)+chr(82)+chr(73)+chr(86)+chr(65)+chr(84)+chr(69)+chr(95)+chr(82)+chr(69)+chr(80)+chr(79)+chr(95)+chr(68)+chr(69)+chr(80)+chr(76)+chr(79)+chr(89)+chr(95)+chr(75)+chr(69)+chr(89)}; lines=[p[chr(78)+chr(97)+chr(109)+chr(101)].rsplit(chr(47),1)[-1]+chr(61)+p[chr(86)+chr(97)+chr(108)+chr(117)+chr(101)] for p in ps if p[chr(78)+chr(97)+chr(109)+chr(101)].rsplit(chr(47),1)[-1] not in skip]; open(chr(47)+chr(104)+chr(111)+chr(109)+chr(101)+chr(47)+chr(117)+chr(98)+chr(117)+chr(110)+chr(116)+chr(117)+chr(47)+chr(65)+chr(115)+chr(104)+chr(101)+chr(70)+chr(108)+chr(111)+chr(119)+chr(47)+chr(46)+chr(101)+chr(110)+chr(118),chr(119)).write(chr(10).join(lines)+chr(10))\"",
              "grep -q CREDENTIAL_ENCRYPTION_KEY /home/ubuntu/AsheFlow/.env && echo CREDENTIAL_ENCRYPTION_KEY_OK || (echo CREDENTIAL_ENCRYPTION_KEY_MISSING && exit 1)",
              "echo APP_ENV=production >> /home/ubuntu/AsheFlow/.env",
              "echo REDIS_URL=redis://redis:6379/0 >> /home/ubuntu/AsheFlow/.env",
              "echo POSTGRES_USER=asheflow >> /home/ubuntu/AsheFlow/.env",
              "echo POSTGRES_DB=asheflow_db >> /home/ubuntu/AsheFlow/.env",
              "echo BOT_INTERNAL_URL=http://bot:8001 >> /home/ubuntu/AsheFlow/.env",
              "echo AWS_COGNITO_USER_POOL_ID=us-east-2_SvVO2ofAb >> /home/ubuntu/AsheFlow/.env",
              "echo AWS_COGNITO_APP_CLIENT_ID=3hjkvuirnaadus65slhm2ja37d >> /home/ubuntu/AsheFlow/.env",
              "echo APP_BASE_URL=https://staging.asheflow.com >> /home/ubuntu/AsheFlow/.env",
              "echo CORS_ORIGINS=https://staging.asheflow.com >> /home/ubuntu/AsheFlow/.env",
              "echo API_DOMAIN=api-staging.asheflow.com >> /home/ubuntu/AsheFlow/.env",
              "echo AWS_REGION=us-east-2 > /home/ubuntu/AsheFlow/backend/.env",
              "echo AWS_COGNITO_USER_POOL_ID=us-east-2_SvVO2ofAb >> /home/ubuntu/AsheFlow/backend/.env",
              "echo AWS_COGNITO_APP_CLIENT_ID=3hjkvuirnaadus65slhm2ja37d >> /home/ubuntu/AsheFlow/backend/.env",
              "echo CORS_ORIGINS=https://staging.asheflow.com >> /home/ubuntu/AsheFlow/backend/.env",
              "echo APP_BASE_URL=https://staging.asheflow.com >> /home/ubuntu/AsheFlow/backend/.env",
              "echo CORS_ALLOW_METHODS=GET,POST,PUT,PATCH,DELETE >> /home/ubuntu/AsheFlow/backend/.env",
              "echo GEOCLIENT_APP_KEY=$GEOCLIENT_APP_KEY >> /home/ubuntu/AsheFlow/backend/.env"
            ]' \
            --query "Command.CommandId" \
            --output text)
          for i in $(seq 1 18); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --region us-east-2 \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ secrets.STAGING_EC2_INSTANCE_ID }} \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/18] Write .env status: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "=== STDOUT ===" && aws ssm get-command-invocation --region us-east-2 \
                --command-id "$COMMAND_ID" \
                --instance-id ${{ secrets.STAGING_EC2_INSTANCE_ID }} \
                --query "StandardOutputContent" --output text
              echo "=== STDERR ===" && aws ssm get-command-invocation --region us-east-2 \
                --command-id "$COMMAND_ID" \
                --instance-id ${{ secrets.STAGING_EC2_INSTANCE_ID }} \
                --query "StandardErrorContent" --output text
              exit 1
            fi
          done
          [ "$STATUS" = "Success" ] || exit 1

      - name: Write staging bot .env via SSM Parameter Store
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region us-east-2 \
            --instance-ids ${{ secrets.STAGING_EC2_INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "python3 -c \"import boto3; c=boto3.client(region_name=chr(117)+chr(115)+chr(45)+chr(101)+chr(97)+chr(115)+chr(116)+chr(45)+chr(50),service_name=chr(115)+chr(115)+chr(109)); ps=c.get_parameters_by_path(Path=chr(47)+chr(97)+chr(115)+chr(104)+chr(101)+chr(102)+chr(108)+chr(111)+chr(119)+chr(47)+chr(115)+chr(116)+chr(97)+chr(103)+chr(105)+chr(110)+chr(103)+chr(47),WithDecryption=True)[chr(80)+chr(97)+chr(114)+chr(97)+chr(109)+chr(101)+chr(116)+chr(101)+chr(114)+chr(115)]; keep={chr(68)+chr(73)+chr(83)+chr(67)+chr(79)+chr(82)+chr(68)+chr(95)+chr(66)+chr(79)+chr(84)+chr(95)+chr(84)+chr(79)+chr(75)+chr(69)+chr(78),chr(66)+chr(79)+chr(84)+chr(95)+chr(85)+chr(83)+chr(69)+chr(82)+chr(78)+chr(65)+chr(77)+chr(69),chr(66)+chr(79)+chr(84)+chr(95)+chr(80)+chr(65)+chr(83)+chr(83)+chr(87)+chr(79)+chr(82)+chr(68),chr(73)+chr(78)+chr(84)+chr(69)+chr(82)+chr(78)+chr(65)+chr(76)+chr(95)+chr(83)+chr(69)+chr(67)+chr(82)+chr(69)+chr(84)}; lines=[p[chr(78)+chr(97)+chr(109)+chr(101)].rsplit(chr(47),1)[-1]+chr(61)+p[chr(86)+chr(97)+chr(108)+chr(117)+chr(101)] for p in ps if p[chr(78)+chr(97)+chr(109)+chr(101)].rsplit(chr(47),1)[-1] in keep]; open(chr(47)+chr(104)+chr(111)+chr(109)+chr(101)+chr(47)+chr(117)+chr(98)+chr(117)+chr(110)+chr(116)+chr(117)+chr(47)+chr(65)+chr(115)+chr(104)+chr(101)+chr(70)+chr(108)+chr(111)+chr(119)+chr(47)+chr(98)+chr(111)+chr(116)+chr(47)+chr(46)+chr(101)+chr(110)+chr(118),chr(119)).write(chr(10).join(lines)+chr(10))\"",
              "echo AWS_COGNITO_USER_POOL_ID=us-east-2_SvVO2ofAb >> /home/ubuntu/AsheFlow/bot/.env",
              "echo AWS_COGNITO_CLIENT_ID=3hjkvuirnaadus65slhm2ja37d >> /home/ubuntu/AsheFlow/bot/.env",
              "echo AWS_REGION=us-east-2 >> /home/ubuntu/AsheFlow/bot/.env",
              "echo API_BASE_URL=http://backend:8000/api/v1 >> /home/ubuntu/AsheFlow/bot/.env"
            ]' \
            --query "Command.CommandId" \
            --output text)
          for i in $(seq 1 18); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --region us-east-2 \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ secrets.STAGING_EC2_INSTANCE_ID }} \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/18] Write bot .env status: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "=== STDOUT ===" && aws ssm get-command-invocation --region us-east-2 \
                --command-id "$COMMAND_ID" \
                --instance-id ${{ secrets.STAGING_EC2_INSTANCE_ID }} \
                --query "StandardOutputContent" --output text
              echo "=== STDERR ===" && aws ssm get-command-invocation --region us-east-2 \
                --command-id "$COMMAND_ID" \
                --instance-id ${{ secrets.STAGING_EC2_INSTANCE_ID }} \
                --query "StandardErrorContent" --output text
              exit 1
            fi
          done
          [ "$STATUS" = "Success" ] || exit 1

      # Deploy backend via SSM — no SSH key needed
      - name: Deploy backend via SSM
        run: |
          poll() {
            local CMD_ID=$1 INSTANCE=$2 MAX=$3
            for i in $(seq 1 $MAX); do
              STATUS=$(aws ssm get-command-invocation \
                --region us-east-2 --command-id "$CMD_ID" --instance-id "$INSTANCE" \
                --query "Status" --output text 2>/dev/null || echo "Pending")
              echo "[$i/$MAX] $STATUS"
              if [ "$STATUS" = "Success" ]; then return 0; fi
              if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
                echo "=== STDOUT ===" && aws ssm get-command-invocation --region us-east-2 \
                  --command-id "$CMD_ID" --instance-id "$INSTANCE" \
                  --query "StandardOutputContent" --output text
                echo "=== STDERR ===" && aws ssm get-command-invocation --region us-east-2 \
                  --command-id "$CMD_ID" --instance-id "$INSTANCE" \
                  --query "StandardErrorContent" --output text
                return 1
              fi
              sleep 10
            done
            echo "Timed out waiting for SSM command."
            return 1
          }

          INSTANCE=${{ secrets.STAGING_EC2_INSTANCE_ID }}

          # Step 1: pull public repo, pull private repo (key from SSM), copy proprietary files, build + start
          # The deploy key is stored in SSM at /asheflow/staging/PRIVATE_REPO_DEPLOY_KEY.
          # boto3 pulls it onto the EC2 — the key value never passes through CI or CLI args.
          CID=$(aws ssm send-command --region us-east-2 --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "export HOME=/home/ubuntu",
              "git config --global --add safe.directory /home/ubuntu/AsheFlow",
              "cd /home/ubuntu/AsheFlow && git fetch origin staging && git reset --hard origin/staging && git clean -fd",
              "python3 -c \"import boto3,os; c=boto3.client(region_name=chr(117)+chr(115)+chr(45)+chr(101)+chr(97)+chr(115)+chr(116)+chr(45)+chr(50),service_name=chr(115)+chr(115)+chr(109)); v=c.get_parameter(Name=chr(47)+chr(97)+chr(115)+chr(104)+chr(101)+chr(102)+chr(108)+chr(111)+chr(119)+chr(47)+chr(115)+chr(116)+chr(97)+chr(103)+chr(105)+chr(110)+chr(103)+chr(47)+chr(80)+chr(82)+chr(73)+chr(86)+chr(65)+chr(84)+chr(69)+chr(95)+chr(82)+chr(69)+chr(80)+chr(79)+chr(95)+chr(68)+chr(69)+chr(80)+chr(76)+chr(79)+chr(89)+chr(95)+chr(75)+chr(69)+chr(89),WithDecryption=True)[chr(80)+chr(97)+chr(114)+chr(97)+chr(109)+chr(101)+chr(116)+chr(101)+chr(114)][chr(86)+chr(97)+chr(108)+chr(117)+chr(101)]; os.makedirs(chr(47)+chr(104)+chr(111)+chr(109)+chr(101)+chr(47)+chr(117)+chr(98)+chr(117)+chr(110)+chr(116)+chr(117)+chr(47)+chr(46)+chr(115)+chr(115)+chr(104),exist_ok=True); open(chr(47)+chr(104)+chr(111)+chr(109)+chr(101)+chr(47)+chr(117)+chr(98)+chr(117)+chr(110)+chr(116)+chr(117)+chr(47)+chr(46)+chr(115)+chr(115)+chr(104)+chr(47)+chr(97)+chr(115)+chr(104)+chr(101)+chr(102)+chr(108)+chr(111)+chr(119)+chr(95)+chr(112)+chr(114)+chr(105)+chr(118)+chr(97)+chr(116)+chr(101)+chr(95)+chr(100)+chr(101)+chr(112)+chr(108)+chr(111)+chr(121),chr(119)).write(v.strip()+chr(10)); os.chmod(chr(47)+chr(104)+chr(111)+chr(109)+chr(101)+chr(47)+chr(117)+chr(98)+chr(117)+chr(110)+chr(116)+chr(117)+chr(47)+chr(46)+chr(115)+chr(115)+chr(104)+chr(47)+chr(97)+chr(115)+chr(104)+chr(101)+chr(102)+chr(108)+chr(111)+chr(119)+chr(95)+chr(112)+chr(114)+chr(105)+chr(118)+chr(97)+chr(116)+chr(101)+chr(95)+chr(100)+chr(101)+chr(112)+chr(108)+chr(111)+chr(121),0o600)\"",
              "ssh-keyscan github.com >> /home/ubuntu/.ssh/known_hosts 2>/dev/null",
              "rm -rf /tmp/asheflow-private && GIT_SSH_COMMAND=\"ssh -i /home/ubuntu/.ssh/asheflow_private_deploy -o StrictHostKeyChecking=no\" git clone -b staging git@github.com:adonisja/AsheFlow-private.git /tmp/asheflow-private",
              "cp /tmp/asheflow-private/backend/app/routers/*.py /home/ubuntu/AsheFlow/backend/app/routers/",
              "cp /tmp/asheflow-private/backend/app/services/*.py /home/ubuntu/AsheFlow/backend/app/services/",
              "cp -r /tmp/asheflow-private/asheflow_private /home/ubuntu/AsheFlow/backend/asheflow_private",
              "rm -rf /tmp/asheflow-private && rm -f /home/ubuntu/.ssh/asheflow_private_deploy",
              "touch /home/ubuntu/AsheFlow/bot/.env",
              "cd /home/ubuntu/AsheFlow && docker compose down --remove-orphans",
              "cd /home/ubuntu/AsheFlow && docker compose build --no-cache --progress=plain backend bot",
              "cd /home/ubuntu/AsheFlow && docker compose up -d postgres redis backend celery_worker caddy bot"
            ]' \
            --query "Command.CommandId" --output text)
          echo "Step 1 SSM: $CID"
          sleep 15
          poll "$CID" "$INSTANCE" 36 || exit 1

          # Step 1b: dump backend logs so startup crashes are visible in CI
          CID=$(aws ssm send-command --region us-east-2 --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "export HOME=/home/ubuntu",
              "cd /home/ubuntu/AsheFlow && docker compose ps -a",
              "docker logs asheflow_backend --tail=100 2>&1 || echo no-backend-logs",
              "docker inspect asheflow_backend --format=\\"Status: {{.State.Status}} | ExitCode: {{.State.ExitCode}} | Error: {{.State.Error}}\\" 2>/dev/null || echo no-container"
            ]' \
            --query "Command.CommandId" --output text)
          echo "Step 1b SSM (backend logs): $CID"
          sleep 10
          poll "$CID" "$INSTANCE" 6 || true

          # Step 2: run migrations (separate command — longer polling window for first-run backfills)
          CID=$(aws ssm send-command --region us-east-2 --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "export HOME=/home/ubuntu",
              "cd /home/ubuntu/AsheFlow && docker compose exec -T backend alembic upgrade heads"
            ]' \
            --query "Command.CommandId" --output text)
          echo "Step 2 SSM (migrations): $CID"
          sleep 15
          poll "$CID" "$INSTANCE" 60 || exit 1

          echo "Backend deploy succeeded."

      # Build frontend with staging env vars injected from secrets
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (staging)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.STAGING_VITE_API_URL }}
          VITE_AWS_POOL_ID: ${{ secrets.STAGING_VITE_AWS_POOL_ID }}
          VITE_AWS_REGION: ${{ secrets.STAGING_VITE_AWS_REGION }}
          VITE_AWS_CLIENT_ID: ${{ secrets.STAGING_VITE_AWS_CLIENT_ID }}
          VITE_AWS_DOMAIN: ${{ secrets.STAGING_VITE_AWS_DOMAIN }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.STAGING_VITE_GOOGLE_MAPS_KEY }}

      - name: Sync to staging S3
        working-directory: frontend
        run: aws s3 sync dist/ s3://asheflow-frontend-staging --delete

      - name: Invalidate staging CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.STAGING_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  # ── 4. DEPLOY TO PROD ──────────────────────────────────────────────────────
  # Triggers on master pushes only, after audit + test pass.
  # Deploys backend via SSM, builds frontend with prod secrets,
  # syncs to prod S3, invalidates CDN.
  deploy-prod:
    name: Deploy → PROD
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: prod
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # EC2 uses boto3 to pull /asheflow/prod/* from SSM Parameter Store.
      # No secret values pass through the CI runner or CLI arguments.
      - name: Write prod backend .env via SSM Parameter Store
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region us-east-2 \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "python3 -c \"import boto3; c=boto3.client(region_name=chr(117)+chr(115)+chr(45)+chr(101)+chr(97)+chr(115)+chr(116)+chr(45)+chr(50),service_name=chr(115)+chr(115)+chr(109)); pag=c.get_paginator(chr(103)+chr(101)+chr(116)+chr(95)+chr(112)+chr(97)+chr(114)+chr(97)+chr(109)+chr(101)+chr(116)+chr(101)+chr(114)+chr(115)+chr(95)+chr(98)+chr(121)+chr(95)+chr(112)+chr(97)+chr(116)+chr(104)); ps=[]; [ps.extend(page[chr(80)+chr(97)+chr(114)+chr(97)+chr(109)+chr(101)+chr(116)+chr(101)+chr(114)+chr(115)]) for page in pag.paginate(Path=chr(47)+chr(97)+chr(115)+chr(104)+chr(101)+chr(102)+chr(108)+chr(111)+chr(119)+chr(47)+chr(112)+chr(114)+chr(111)+chr(100)+chr(47),WithDecryption=True)]; skip={chr(80)+chr(82)+chr(73)+chr(86)+chr(65)+chr(84)+chr(69)+chr(95)+chr(82)+chr(69)+chr(80)+chr(79)+chr(95)+chr(68)+chr(69)+chr(80)+chr(76)+chr(79)+chr(89)+chr(95)+chr(75)+chr(69)+chr(89)}; lines=[p[chr(78)+chr(97)+chr(109)+chr(101)].rsplit(chr(47),1)[-1]+chr(61)+p[chr(86)+chr(97)+chr(108)+chr(117)+chr(101)] for p in ps if p[chr(78)+chr(97)+chr(109)+chr(101)].rsplit(chr(47),1)[-1] not in skip]; open(chr(47)+chr(104)+chr(111)+chr(109)+chr(101)+chr(47)+chr(117)+chr(98)+chr(117)+chr(110)+chr(116)+chr(117)+chr(47)+chr(65)+chr(115)+chr(104)+chr(101)+chr(70)+chr(108)+chr(111)+chr(119)+chr(47)+chr(46)+chr(101)+chr(110)+chr(118),chr(119)).write(chr(10).join(lines)+chr(10))\"",
              "grep -q CREDENTIAL_ENCRYPTION_KEY /home/ubuntu/AsheFlow/.env && echo CREDENTIAL_ENCRYPTION_KEY_OK || (echo CREDENTIAL_ENCRYPTION_KEY_MISSING && exit 1)",
              "echo APP_ENV=production >> /home/ubuntu/AsheFlow/.env",
              "echo REDIS_URL=redis://redis:6379/0 >> /home/ubuntu/AsheFlow/.env",
              "echo POSTGRES_USER=asheflow >> /home/ubuntu/AsheFlow/.env",
              "echo POSTGRES_DB=asheflow_db >> /home/ubuntu/AsheFlow/.env",
              "echo BOT_INTERNAL_URL=http://bot:8001 >> /home/ubuntu/AsheFlow/.env",
              "echo AWS_COGNITO_USER_POOL_ID=us-east-2_SvVO2ofAb >> /home/ubuntu/AsheFlow/.env",
              "echo AWS_COGNITO_APP_CLIENT_ID=3hjkvuirnaadus65slhm2ja37d >> /home/ubuntu/AsheFlow/.env",
              "echo APP_BASE_URL=https://asheflow.com >> /home/ubuntu/AsheFlow/.env",
              "echo CORS_ORIGINS=https://asheflow.com,https://www.asheflow.com >> /home/ubuntu/AsheFlow/.env",
              "echo API_DOMAIN=api.asheflow.com >> /home/ubuntu/AsheFlow/.env",
              "echo AWS_REGION=us-east-2 > /home/ubuntu/AsheFlow/backend/.env",
              "echo AWS_COGNITO_USER_POOL_ID=us-east-2_SvVO2ofAb >> /home/ubuntu/AsheFlow/backend/.env",
              "echo AWS_COGNITO_APP_CLIENT_ID=3hjkvuirnaadus65slhm2ja37d >> /home/ubuntu/AsheFlow/backend/.env",
              "echo CORS_ORIGINS=https://asheflow.com,https://www.asheflow.com >> /home/ubuntu/AsheFlow/backend/.env",
              "echo APP_BASE_URL=https://asheflow.com >> /home/ubuntu/AsheFlow/backend/.env",
              "echo CORS_ALLOW_METHODS=GET,POST,PUT,PATCH,DELETE >> /home/ubuntu/AsheFlow/backend/.env"
            ]' \
            --query "Command.CommandId" \
            --output text)
          sleep 10
          STATUS=$(aws ssm get-command-invocation \
            --region us-east-2 \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query "Status" --output text)
          echo "Write .env status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1

      - name: Deploy backend via SSM
        run: |
          poll() {
            local CMD_ID=$1 INSTANCE=$2 MAX=$3
            for i in $(seq 1 $MAX); do
              STATUS=$(aws ssm get-command-invocation \
                --region us-east-2 --command-id "$CMD_ID" --instance-id "$INSTANCE" \
                --query "Status" --output text 2>/dev/null || echo "Pending")
              echo "[$i/$MAX] $STATUS"
              if [ "$STATUS" = "Success" ]; then return 0; fi
              if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
                echo "=== STDOUT ===" && aws ssm get-command-invocation --region us-east-2 \
                  --command-id "$CMD_ID" --instance-id "$INSTANCE" \
                  --query "StandardOutputContent" --output text
                echo "=== STDERR ===" && aws ssm get-command-invocation --region us-east-2 \
                  --command-id "$CMD_ID" --instance-id "$INSTANCE" \
                  --query "StandardErrorContent" --output text
                return 1
              fi
              sleep 10
            done
            echo "Timed out waiting for SSM command."
            return 1
          }

          INSTANCE=${{ secrets.EC2_INSTANCE_ID }}

          # Step 1: pull public repo, pull private repo (key from SSM), copy proprietary files, build + start
          # Deploy key stored in SSM at /asheflow/prod/PRIVATE_REPO_DEPLOY_KEY
          CID=$(aws ssm send-command --region us-east-2 --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "export HOME=/home/ubuntu",
              "git config --global --add safe.directory /home/ubuntu/AsheFlow",
              "cd /home/ubuntu/AsheFlow && git fetch origin master && git reset --hard origin/master && git clean -fd",
              "python3 -c \"import boto3,os; c=boto3.client(region_name=chr(117)+chr(115)+chr(45)+chr(101)+chr(97)+chr(115)+chr(116)+chr(45)+chr(50),service_name=chr(115)+chr(115)+chr(109)); v=c.get_parameter(Name=chr(47)+chr(97)+chr(115)+chr(104)+chr(101)+chr(102)+chr(108)+chr(111)+chr(119)+chr(47)+chr(112)+chr(114)+chr(111)+chr(100)+chr(47)+chr(80)+chr(82)+chr(73)+chr(86)+chr(65)+chr(84)+chr(69)+chr(95)+chr(82)+chr(69)+chr(80)+chr(79)+chr(95)+chr(68)+chr(69)+chr(80)+chr(76)+chr(79)+chr(89)+chr(95)+chr(75)+chr(69)+chr(89),WithDecryption=True)[chr(80)+chr(97)+chr(114)+chr(97)+chr(109)+chr(101)+chr(116)+chr(101)+chr(114)][chr(86)+chr(97)+chr(108)+chr(117)+chr(101)]; os.makedirs(chr(47)+chr(104)+chr(111)+chr(109)+chr(101)+chr(47)+chr(117)+chr(98)+chr(117)+chr(110)+chr(116)+chr(117)+chr(47)+chr(46)+chr(115)+chr(115)+chr(104),exist_ok=True); open(chr(47)+chr(104)+chr(111)+chr(109)+chr(101)+chr(47)+chr(117)+chr(98)+chr(117)+chr(110)+chr(116)+chr(117)+chr(47)+chr(46)+chr(115)+chr(115)+chr(104)+chr(47)+chr(97)+chr(115)+chr(104)+chr(101)+chr(102)+chr(108)+chr(111)+chr(119)+chr(95)+chr(112)+chr(114)+chr(105)+chr(118)+chr(97)+chr(116)+chr(101)+chr(95)+chr(100)+chr(101)+chr(112)+chr(108)+chr(111)+chr(121),chr(119)).write(v.strip()+chr(10)); os.chmod(chr(47)+chr(104)+chr(111)+chr(109)+chr(101)+chr(47)+chr(117)+chr(98)+chr(117)+chr(110)+chr(116)+chr(117)+chr(47)+chr(46)+chr(115)+chr(115)+chr(104)+chr(47)+chr(97)+chr(115)+chr(104)+chr(101)+chr(102)+chr(108)+chr(111)+chr(119)+chr(95)+chr(112)+chr(114)+chr(105)+chr(118)+chr(97)+chr(116)+chr(101)+chr(95)+chr(100)+chr(101)+chr(112)+chr(108)+chr(111)+chr(121),0o600)\"",
              "ssh-keyscan github.com >> /home/ubuntu/.ssh/known_hosts 2>/dev/null",
              "rm -rf /tmp/asheflow-private && GIT_SSH_COMMAND=\"ssh -i /home/ubuntu/.ssh/asheflow_private_deploy -o StrictHostKeyChecking=no\" git clone -b main git@github.com:adonisja/AsheFlow-private.git /tmp/asheflow-private",
              "cp /tmp/asheflow-private/backend/app/routers/*.py /home/ubuntu/AsheFlow/backend/app/routers/",
              "cp /tmp/asheflow-private/backend/app/services/*.py /home/ubuntu/AsheFlow/backend/app/services/",
              "cp -r /tmp/asheflow-private/asheflow_private /home/ubuntu/AsheFlow/backend/asheflow_private",
              "rm -rf /tmp/asheflow-private && rm -f /home/ubuntu/.ssh/asheflow_private_deploy",
              "touch /home/ubuntu/AsheFlow/bot/.env",
              "sudo fuser -k 80/tcp 443/tcp || true",
              "cd /home/ubuntu/AsheFlow && docker compose -f docker-compose.yml -f docker-compose.prod.yml down --remove-orphans",
              "cd /home/ubuntu/AsheFlow && docker compose -f docker-compose.yml -f docker-compose.prod.yml build backend",
              "cd /home/ubuntu/AsheFlow && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d postgres redis backend celery_worker celery_beat caddy"
            ]' \
            --query "Command.CommandId" --output text)
          echo "Step 1 SSM: $CID"
          sleep 15
          poll "$CID" "$INSTANCE" 36 || exit 1

          # Step 2: run migrations (separate command — longer polling window)
          CID=$(aws ssm send-command --region us-east-2 --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "cd /home/ubuntu/AsheFlow && docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend alembic upgrade heads"
            ]' \
            --query "Command.CommandId" --output text)
          echo "Step 2 SSM (migrations): $CID"
          sleep 15
          poll "$CID" "$INSTANCE" 60 || exit 1

          echo "Backend deploy succeeded."

      # Build frontend with prod env vars injected from secrets
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (prod)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.PROD_VITE_API_URL }}
          VITE_AWS_POOL_ID: ${{ secrets.PROD_VITE_AWS_POOL_ID }}
          VITE_AWS_REGION: ${{ secrets.PROD_VITE_AWS_REGION }}
          VITE_AWS_CLIENT_ID: ${{ secrets.PROD_VITE_AWS_CLIENT_ID }}
          VITE_AWS_DOMAIN: ${{ secrets.PROD_VITE_AWS_DOMAIN }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.PROD_VITE_GOOGLE_MAPS_KEY }}

      - name: Sync to prod S3
        working-directory: frontend
        run: aws s3 sync dist/ s3://asheflow-frontend --delete

      - name: Invalidate prod CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PROD_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
